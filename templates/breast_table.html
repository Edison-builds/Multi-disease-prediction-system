{%extends 'tem_base.html'%} 
{%block content%}
<form style="margin-left: 650px;" action="" method="POST" enctype="multipart/form-data">
    <label>Upload you file</label>
    <input type="file" name="csv_file" id="" required>
    <button class="btn btn-primary" type="submit"><a href="{% url 'breast_data' %}">Upload</a></button>
</form>
<br>
<table style="color: black;" class="table">
    <tdead>
        <tr>
            <th>Mean Radius</th>
            <th>Mean Texture</th>
            <th>Mean Perimeter</th>
            <th>Mean Area</th>
            <th>Mean Smoothness</th>
        </tr>
    </tdead>
    <tbody>
        {% for i in data %}
        <tr>
            <td>{{i.mean_smoothness}}</td>
            <td>{{i.mean_texture}}</td>
            <td>{{i.mean_perimeter}}</td>
            <td>{{i.mean_area}}</td>
            <td>{{i.mean_smoothness}}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
