{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body style="background: rgb(222,236,237);
background: linear-gradient(90deg, rgba(222,236,237,0.8603816526610644) 0%, rgba(255,255,255,0.9864320728291317) 50%, rgba(179,202,205,0.8827906162464986) 100%);">
    <section class=" text-center text-lg-start">
        <style>
          .rounded-t-5 {
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
          }

          @media (min-width: 992px) {
            .rounded-tr-lg-0 {
              border-top-right-radius: 0;
            }
      
            .rounded-bl-lg-5 {
              border-bottom-left-radius: 0.5rem;
            }
          }

        </style>
        <div class=" mb-3">
            <br><br>
          <div class="row g-0 d-flex align-items-center">
            <div class="col-lg-2"></div>
            <div class="col-lg-4 d-none d-lg-flex">
              <img src="{% static 'Data_security_05.jpg' %}" alt="Trendy Pants and Shoes"
                class="w-100 rounded-t-5 rounded-tr-lg-0 rounded-bl-lg-5" />
            </div>
            <div class="col-lg-4">
              <div class="card-body py-5 px-md-5">
                <h3>Login</h3><br><br>
                <form action="" method="POST">
                    {% csrf_token %}
                  <div data-mdb-input-init class="form-outline mb-3">
                    <label class="form-label" for="form2Example1">Username</label>
                    <input name="username" type="text" id="form2Example1" class="form-control shadow-none" />
                  </div>
                  <div data-mdb-input-init class="form-outline mb-4">
                    <label class="form-label" for="form2Example2">Password</label>
                    <input name="password" type="password" id="form2Example2" class="form-control shadow-none" />
                  </div>
                  <div class="row mb-4">
                    <div class="col d-flex justify-content-center">
                      <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="form2Example31" checked />
                        <label class="form-check-label" for="form2Example31"> Remember me </label>
                      </div>
                    </div>
                    <div class="col">
                      <a href="#!">Forgot password?</a>
                    </div>
                  </div>
                  <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">Sign in</button>
                  </form>
              </div>
            </div>
          </div>
        </div>
      </section>
</body>
</html>
